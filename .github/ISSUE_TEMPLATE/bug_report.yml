name: Bug Report
description: File a bug or unexpected behavior in the system
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue in the Municipal Complaint Management System!
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is affected?
      placeholder: "e.g., Database Schema, Backend API, Citizen Portal, Decision Support"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions.
      placeholder: |
        1. Submit complaint with invalid phone
        2. Expected 400 Bad Request error
        3. Observed 500 Internal Server Error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python/Node versions, or Docker setup.
      placeholder: "Windows 11, Docker Compose, PostgreSQL 16"
